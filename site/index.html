<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>審判要項｜第70回 那珂南校区体育祭</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#145da0" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="app-header">
  <div class="app-header__frame">
    <p class="app-header__kicker">第70回　那珂南校区体育祭</p>
    <h1 class="app-header__title">審判要項</h1>
    <p class="app-header__date">2026年10月4日（日）</p>
    <svg class="app-header__runner" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="44" cy="10" r="5" fill="currentColor" />
      <path
        d="M40 17 L28 32 M28 32 L38 38 L34 50 M28 32 L18 36 L10 28 M40 17 L30 14 L22 20 M40 17 L48 24 L44 34"
        fill="none"
        stroke="currentColor"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </div>
</header>

<main id="view-timeline" class="view">
  <div class="filter-bar">
    <label class="filter-label" for="staff-select">担当者で絞り込み</label>
    <select id="staff-select" class="staff-select"></select>
  </div>
  <ol class="timeline" id="timeline-list"></ol>
</main>

<section id="view-detail" class="view is-hidden">
  <button type="button" class="back-button" id="back-button">← 一覧へ戻る</button>
  <div id="detail-content"></div>
</section>

<div id="image-overlay" class="image-overlay is-hidden">
  <button type="button" id="image-overlay-close" class="image-overlay__close" aria-label="閉じる">✕</button>
  <img id="image-overlay-img" alt="配置図拡大表示" />
</div>

<script src="js/app.js"></script>
</body>
</html>
